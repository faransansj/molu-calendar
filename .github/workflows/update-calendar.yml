name: Update calendar

on:
  schedule:
    # Every day at 06:00 KST (21:00 UTC the previous day).
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: Read more history (3 pages × 50 threads per board)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: calendar-feed-update
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DATABASE_ID: ${{ vars.CLOUDFLARE_DATABASE_ID }}
      CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export current D1 archive
        run: pnpm calendar:export --out .calendar/feed.json --remote
      - name: Read official notices strictly
        env:
          BACKFILL: ${{ inputs.backfill }}
        run: |
          if [ "$BACKFILL" = "true" ]; then
            pnpm scrape --out .calendar/feed.json --strict --pages 3 --page-size 50
          else
            pnpm scrape --out .calendar/feed.json --strict
          fi
      - name: Upload and activate official version
        run: pnpm calendar:upload --feed .calendar/feed.json --base .calendar/base.json --remote
