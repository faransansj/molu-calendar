name: Inspect deployed Worker CPU

on:
  push:
    branches: [fix/runtime-calendar-data]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read deployed invocation metrics without application mutations
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/observability/telemetry/query`, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({
              queryId: `molu-cpu-${process.env.GITHUB_RUN_ID}`,
              timeframe: { from: Date.parse("2026-11-13T13:20:00Z"), to: Date.now() },
              view: "events", limit: 2000, dry: true,
              parameters: { filterCombination: "and", filters: [{ key: "$workers.scriptName", operation: "eq", type: "string", value: "molu-calendar" }] },
            }),
            signal: AbortSignal.timeout(60000),
          });
          console.log(`Telemetry API HTTP ${response.status}`);
          assert.ok(response.ok);
          const envelope = await response.json();
          assert.equal(envelope.success, true);
          const result = envelope.result;
          const events = Array.isArray(result.events) ? result.events : result.events?.events ?? [];
          const metrics = events.flatMap(event => {
            const worker = event.$workers ?? {};
            const metadata = event.$metadata ?? {};
            const cpu = worker.cpuTimeMs;
            if (typeof cpu !== "number") return [];
            return [{ cpuMs: cpu, url: worker.event?.request?.url ?? metadata.url, method: worker.event?.request?.method ?? metadata.method, status: worker.event?.response?.status ?? metadata.status, outcome: worker.outcome, timestamp: event.timestamp ?? metadata.timestamp, version: worker.scriptVersion?.id }];
          });
          console.log(JSON.stringify({ count: metrics.length, invocations: metrics }, null, 2));
          console.log("Only CPU/URL/status/version metadata printed; request headers, bodies and credentials omitted");
          NODE
